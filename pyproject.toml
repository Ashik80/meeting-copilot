[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Local Linux meeting copilot with quiet contextual insights"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.1.
stt = ["faster-whisper>=1.2,<2", "av>=11,<19"]
desktop = ["PySide6>=6.8,<7"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
copilot-benchmark = "meeting_copilot.benchmark:main"
meeting-copilot = "meeting_copilot.panel:main"
copilot-evaluate = "meeting_copilot.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_copilot"]

[tool.ruff]
target-version = "py312"
line-length = 110
